<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>قمة الصعود</title>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<div id="hud">
  <div class="top">
    <b>QIMMAT AL-SUOUD</b>
    <span id="speed">0 km/h</span>
  </div>

  <div id="mission">
    الوصول إلى نقطة القمة
  </div>

  <div id="wanted">
    ☆ ☆ ☆ ☆ ☆
  </div>

  <div id="money">
    $ 2500
  </div>
</div>

<div id="touch">

  <div class="left">
    <button data-key="left">◀</button>
    <button data-key="right">▶</button>
  </div>

  <div class="right">
    <button data-key="brake">فرامل</button>
    <button data-key="gas">غاز</button>
  </div>

  <button class="action" data-key="enter">
    دخول
  </button>

</div>

<div id="loading">
  <div>QIMMAT AL-SUOUD</div>
  <small>Loading world...</small>
</div>

<script type="module" src="/src/main.ts"></script>

</body>
  </html>
